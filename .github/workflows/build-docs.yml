name: Build Docs

# hemlang.dev is served by hem-doc-server on a VPS, not GitHub Pages
# (Pages is not enabled for this repo, so the old deploy job failed on
# every push). This workflow verifies that every language builds.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [submodules-updated]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build documentation (all languages)
        run: |
          python build_docs.py --lang all
          for f in docs.html llms.txt; do
            if [ ! -s "$f" ]; then
              echo "Error: $f was not generated"
              exit 1
            fi
          done

      - name: Check pages and internal links
        run: |
          if [ -f tests/check_docs.py ]; then
            python tests/check_docs.py
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: hem-doc-site
          path: |
            docs*.html
            llms*.txt
            favicon.svg
